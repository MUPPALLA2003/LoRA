[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-from-scratch"
version = "1.0.0"
description = "Implementing LoRA from scratch for efficient LLM fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Muppalla Komal", email = "muppallakomaliitkgp2022@gmail.com" }
]

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.16",
    "tokenizers>=0.15",
    "numpy>=1.23",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "wandb>=0.17",
]